services:
  - type: web
    name: agentedu-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///agentedu.db
      - key: DATABASE_SYNC_URL
        value: sqlite:///agentedu.db
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
